name: Publish to Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall main.py app.py agent_cli.py config.py ui services models utils tools tests

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Word templates
        run: python tools/check_templates.py

      - name: Check headless capabilities
        run: python main.py --capabilities --json

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      OUTPUT_FILE_PREFIX: PGT
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content version.txt -Raw
          if ($content -match "FileVersion', u'([\d\.]+)'") {
              $version = $matches[1]
              echo "version=$version" >> $env:GITHUB_OUTPUT
          }
          else {
              echo "::error::Failed to extract version from version.txt"
              exit 1
          }

      - name: Build executable
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          echo "Using version: $version"
          pyinstaller pgt.spec --clean --noconfirm
          if (-not (Test-Path dist/PGT/PGT.exe)) {
              echo "::error::Expected executable 'dist/PGT/PGT.exe' was not created"
              exit 1
          }

      - name: Run packaged diagnostics
        shell: pwsh
        run: |
          ./dist/PGT/PGT.exe --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run packaged agent smoke test
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          ./dist/PGT/PGT.exe --capabilities --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeDir = Join-Path $env:RUNNER_TEMP "pgt-agent-smoke"
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          $imagePath = Join-Path $smokeDir "input.jpg"
          $outputPath = Join-Path $smokeDir "output.docx"
          $resultPath = Join-Path $smokeDir "result.json"
          python -c "from PIL import Image; import sys; Image.new('RGB', (320, 240), (40, 80, 120)).save(sys.argv[1])" $imagePath
          $request = @{
            schema_version = 1
            title = "CI headless smoke"
            location = "GitHub Actions"
            activity_date = "2026-11-27"
            images = @($imagePath)
            output = $outputPath
          } | ConvertTo-Json -Compress
          $stdoutPath = Join-Path $smokeDir "stdout.json"
          $request | ./dist/PGT/PGT.exe --generate - --result-file $resultPath --json | Set-Content -Path $stdoutPath -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,sys,zipfile; from pathlib import Path; result=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8-sig')); saved=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8')); assert result['ok'] and saved['ok']; assert 'word/document.xml' in zipfile.ZipFile(sys.argv[3]).namelist()" $stdoutPath $resultPath $outputPath

      - name: Check package size
        shell: pwsh
        run: python tools/package_report.py dist/PGT --max-mib 130 --json package-report.json

      - name: Upload package report
        uses: actions/upload-artifact@v4
        with:
          name: package-report
          path: package-report.json
          if-no-files-found: error

      - name: Locate Windows SDK SignTool
        shell: pwsh
        run: |
          $candidates = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending
          if (-not $candidates) {
              echo "::error::signtool.exe was not found in the Windows SDK"
              exit 1
          }
          $signToolDirectory = $candidates[0].DirectoryName
          echo "$signToolDirectory" >> $env:GITHUB_PATH
          Write-Host "Using SignTool: $($candidates[0].FullName)"
          ./tools/sign_release.ps1 -TargetPath dist/PGT/PGT.exe -WhatIf

      - name: Sign application executable
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        shell: pwsh
        run: ./tools/sign_release.ps1 -TargetPath dist/PGT/PGT.exe

      - name: Report unsigned build
        if: env.WINDOWS_CERTIFICATE_BASE64 == '' || env.WINDOWS_CERTIFICATE_PASSWORD == ''
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: Write-Host "Code signing skipped: signing credentials are not configured. The release contains an unsigned executable."

      - name: Archive executable
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $zipPath = "dist/${{ env.OUTPUT_FILE_PREFIX }}.$version.zip"
          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "dist/PGT/*" -DestinationPath $zipPath

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.OUTPUT_FILE_PREFIX }}.${{ steps.get_version.outputs.version }}.zip
